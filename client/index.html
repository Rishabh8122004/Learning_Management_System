<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Trackly helps you organize what you want to learn and track your progress."
    />
    <meta name="theme-color" content="#faf8f5" />
    <title>Trackly</title>
    <script>
      // Apply the saved (or system) theme before the first paint, so there is no flash of the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem("trackly-theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#171615" : "#faf8f5");
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
